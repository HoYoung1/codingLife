services:

  # ── 1. Ollama LLM 서버 ─────────────────────────────────────
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # ── 2. 모델 자동 다운로드 (최초 1회) ─────────────────────────
  model-loader:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull llama3.1:8b &&
       ollama pull nomic-embed-text &&
       echo '[model-loader] 모델 준비 완료'"
    restart: "no"

  # ── 3. FastAPI 백엔드 ─────────────────────────────────────────
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # .env 값 덮어쓰기
      - LLM_PROVIDER=${LLM_PROVIDER:-azure}   # 미설정 시 azure 기본값
    volumes:
      - faiss_index:/app/backend/rag/faiss_index
    depends_on:
      model-loader:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 4. Streamlit 프론트엔드 ──────────────────────────────────
  frontend:
    build: .
    command: >
      streamlit run frontend/app.py
      --server.port 8501
      --server.headless true
      --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - LLM_PROVIDER=${LLM_PROVIDER:-azure}
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  ollama_data:    # Ollama 모델 캐시 (재시작 시 재다운로드 방지)
  faiss_index:    # FAISS 벡터 인덱스 (재시작 시 재인덱싱 방지)
